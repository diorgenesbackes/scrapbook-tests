name: Verificar suítes
on:
  pull_request:
    branches: [dev, hlg, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - run: 'test "$(npm --version)" = 11.20.0'
      - run: npm ci
      - run: npm exec -- playwright test --list
      - run: npm exec -- playwright test --config playwright.events.config.ts --list
      - run: npm exec -- playwright test --config playwright.event-structural-lock.config.ts --list
      - run: npm exec -- playwright test --config playwright.audio-submission.config.ts --list
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
          SCRAPBOOK_TEST_PUBLIC_CODE: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SCRAPBOOK_TEST_SECOND_PUBLIC_CODE: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      - run: python3 -B -m unittest discover -s deploy -p 'test_*.py' -v
